[package]
name = "gsi-k-framework"
version = "0.1.0"
edition = "2021"
description = "Signal/execution-separated backtesting framework with deterministic replay, ATR position sizing, SHA-256 session provenance, and multi-sheet Excel reporting"
license = "MIT"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
clap = { version = "4", features = ["derive"] }
rust_xlsxwriter = "0.79"
